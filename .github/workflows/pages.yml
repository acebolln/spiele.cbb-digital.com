name: Deploy to GitHub Pages

# The tree is already plain static HTML/CSS/JS - nothing to compile.
# This just uploads it. Using the Actions deployment rather than the
# legacy Jekyll build, which stalled on this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that every script and theme file parses
        run: |
          for f in games/*/js/*.js games/*/js/themes/*.js games/*/sw.js tools/*.js; do
            node --check "$f"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
